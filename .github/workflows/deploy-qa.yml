name: Deploy Web — QA

on:
  push:
    branches: [qa]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy to qa.huellasperdidas.com
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: https://qa-api.huellasperdidas.com
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: public_html/qa.huellasperdidas.com/
          dangerous-clean-slate: false
